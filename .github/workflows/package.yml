name: Bragi package

# Builds the bragi .deb for Debian trixie on arm64 (Raspberry Pi OS) and
# amd64 (an x86 box such as the HP MicroServer). On a bragi-v* tag both
# packages are attached to one GitHub release; from the
# Actions tab (workflow_dispatch) it's built as an artifact only, for
# testing. See docs/deployment.md.
on:
  push:
    tags:
      - "bragi-v*.*.*"
  # A change to the packaging or the app gets a test build.
  pull_request:
    paths:
      - "packaging/**"
      - "host/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version for a test build"
        default: "0.0.0~test"

permissions:
  contents: write

jobs:
  deb:
    name: deb-trixie-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 python3-venv \
            python3-dev build-essential >/dev/null

      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#bragi-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.0.0~test' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Check the package
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'opt/bragi/venv/bin/uvicorn|usr/lib/systemd/user/bragi.service|udev/rules.d|usr/lib/bragi/bragi-update|system/bragi-update.path|system/bragi-update-check.service|tmpfiles.d/bragi.conf|opt/bragi/VERSION'
          # The bundled environment must run the app on this Python.
          dpkg -i "$deb" || apt-get install -y -qq -f >/dev/null
          cd /opt/bragi && BRAGI_DATA_DIR=/tmp/bragi-data venv/bin/python -c "import app.main; print('app imports')"

      - uses: actions/upload-artifact@v4
        with:
          name: bragi-${{ steps.version.outputs.version }}-trixie-${{ matrix.arch }}
          path: dist/*.deb

  # One release with both packages, once both built: a release step in each
  # build job would race to create the same release.
  release:
    if: github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bragi-*
          path: dist
          merge-multiple: true

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # --latest=false: "Latest" stays with the tray app's releases
          # (client-v*), which is what people download by hand.
          gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Bragi ${{ needs.deb.outputs.version }}" \
            --notes "Bragi ${{ needs.deb.outputs.version }} for Debian trixie on arm64 (Raspberry Pi OS) and amd64. Install from the apt repository (docs/deployment.md) or with \`sudo apt install ./bragi_*.deb\`."
