name: Bragi Android release

on:
  push:
    tags:
      - 'android-v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'android-v(\d+\.\d+\.\d+)', tag)
          source = Path('android/app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if not match or match.group(1) != version:
              raise SystemExit('Android tag must match versionName in android/app/build.gradle.kts')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAGI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Android signing secrets are missing.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bragi-android.p12"

      - name: Build, test, lint, and verify signed APK
        env:
          BRAGI_ANDROID_KEYSTORE: ${{ runner.temp }}/bragi-android.p12
          BRAGI_ANDROID_STORE_PASSWORD: ${{ secrets.BRAGI_ANDROID_STORE_PASSWORD }}
          BRAGI_ANDROID_KEY_ALIAS: ${{ secrets.BRAGI_ANDROID_KEY_ALIAS }}
          BRAGI_ANDROID_KEY_PASSWORD: ${{ secrets.BRAGI_ANDROID_KEY_PASSWORD }}
        run: android/release.sh

      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BragiAndroid-${{ github.ref_name }}
          path: android/app/build/outputs/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/release/BragiAndroid.apk \
            android/app/build/outputs/release/BragiAndroid.apk.sha256 \
            --verify-tag --latest=false \
            --title "Bragi Android ${GITHUB_REF_NAME#android-v}" \
            --notes-file android/RELEASE_NOTES.md

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bragi-android.p12"
