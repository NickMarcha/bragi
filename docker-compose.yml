# Every host-specific value is a variable with a default. Override any of
# them in a .env file next to this one (see .env.example).
services:
  bragi:
    build: .
    image: bragi
    restart: unless-stopped
    # Must be the user whose PipeWire session Bragi controls.
    user: "${BRAGI_UID:-1000}:${BRAGI_GID:-1000}"
    # Lets the container read /dev/input/eventN (owned root:input, mode 660
    # on the host) for the knob watcher - see app/knob_watcher.py.
    # Must match the host's `input` group: `getent group input`.
    group_add:
      - "${INPUT_GID:-996}"
    # `devices:` (not `volumes:`) is required here - a plain bind mount only
    # makes the node visible in the container's filesystem, it does NOT grant
    # the cgroup device-access permission needed to actually open it (that
    # gap surfaced live as EPERM/errno 1, not the EACCES a real Unix
    # permission mismatch would give).
    devices:
      - "/dev/input:/dev/input"
    environment:
      XDG_RUNTIME_DIR: /run/user/${BRAGI_UID:-1000}
    volumes:
      # PipeWire's user socket + WirePlumber state - lets pw-dump/pw-cli/wpctl
      # inside the container talk to the host's real (bare-metal) PipeWire.
      - /run/user/${BRAGI_UID:-1000}:/run/user/${BRAGI_UID:-1000}
      # Peer registry (peers.yaml), balance state (balance.yaml), and
      # peers.conf - the Bragi-managed peers' PipeWire config, which the
      # host's bragi-peers.service runs (host/systemd/). Survives container
      # recreate/redeploy. host/systemd/ expects the default path.
      - ${BRAGI_DATA:-${HOME}/.local/share/bragi/data}:/app/data
    ports:
      - "127.0.0.1:${BRAGI_PORT:-8000}:8000"
