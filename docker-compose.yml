services:
  bragi:
    build: .
    image: bragi
    restart: unless-stopped
    user: "1000:1000"
    environment:
      XDG_RUNTIME_DIR: /run/user/1000
    volumes:
      # PipeWire's user socket + WirePlumber state - lets pw-dump/pw-cli/wpctl
      # inside the container talk to the host's real (bare-metal) PipeWire.
      - /run/user/1000:/run/user/1000
      # Bragi-managed peers only land here (70-bragi-peers.conf); hand-written
      # config in this same host directory is left alone.
      - /home/sage/.config/pipewire/pipewire.conf.d:/host-pipewire-conf.d
      # Peer registry (peers.yaml) - survives container recreate/redeploy.
      - /home/sage/.local/share/bragi/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
