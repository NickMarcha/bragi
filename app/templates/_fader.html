{% macro fader(target, key, direction, volume, connected, max=1.5) %}
{% set v = volume if volume is not none else 1.0 %}
<div class="fader-wrap">
  <div class="fader" data-target="{{ target }}" data-key="{{ key }}" data-direction="{{ direction }}" data-action="volume"
       data-value="{{ v }}" data-max="{{ max }}"
       {% if not connected %}data-disabled="1"{% endif %}>
    <div class="fader-track"></div>
    <div class="fader-fill" style="height: {{ (v / max * 100) }}%;"></div>
    <div class="fader-thumb" style="bottom: {{ (v / max * 100) }}%;"></div>
  </div>
</div>
{% endmacro %}
