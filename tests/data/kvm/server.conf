# Written by deskflow-headless-webui. Saving in the web UI rewrites this file;
# computer positions are kept in webui-layout.json next to it.

section: links
	sage:
		down = sagedeck
	sagedeck:
		up = sage
end

section: options
	keystroke(Control+Alt+F12) = switchToScreen(sage)
	keystroke(Control+Alt+F11) = switchToScreen(sage-dev)
	keystroke(Control+Alt+F10) = switchToScreen(sagedeck)
	keystroke(Control+Alt+F9) = switchToNextScreen
	keystroke(Control+Alt+Semicolon) = keyDown(Control+Alt+Semicolon,sage), keyUp(Control+Alt+Semicolon,sage)
	keystroke(Control+Delete) = lockCursorToScreen(toggle)
	keystroke(Control+Alt+F8) = keystroke(Control+Shift+Alt+M,sage:sage-dev:sagedeck)
end
