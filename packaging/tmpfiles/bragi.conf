# Bragi's updater state. The request file is world-writable on purpose:
# Bragi runs as a user and asks the root updater to check or upgrade by
# writing to it. The worst anyone local can do with it is start a check or
# an upgrade of bragi/deskflow from the signed repository.
d /var/lib/bragi 0755 root root -
f /var/lib/bragi/update-request 0666 root root -
# The setup helper's request (bragi#58): "<action> <user>". It only acts for
# a user that's running Bragi, and only runs its fixed list of fixes.
f /var/lib/bragi/setup-request 0666 root root -
